global
    log stdout format raw daemon "${LOG_LEVEL}"
    pidfile /run/haproxy.pid
    maxconn 2000

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    option redispatch
    retries 3
    timeout http-request 10s
    timeout queue 1m
    timeout connect 10s
    timeout client 10m
    timeout server 10m
    timeout http-keep-alive 10s
    timeout check 10s
    maxconn 2000

backend docker
    server socket $SOCKET_PATH

frontend proxy
    bind @@BIND_PROTO@@

    # Traefik Docker provider and Docker CLI version negotiation.
    acl read_method method GET HEAD
    acl docker_ping path,url_dec -m reg -i "^(/v[0-9.]+)?/_ping$"
    acl docker_version path,url_dec -m reg -i "^(/v[0-9.]+)?/version$"
    acl docker_info path,url_dec -m reg -i "^(/v[0-9.]+)?/info$"
    acl docker_events path,url_dec -m reg -i "^(/v[0-9.]+)?/events$"
    acl container_list path,url_dec -m reg -i "^(/v[0-9.]+)?/containers/json$"
    acl container_inspect path,url_dec -m reg -i "^(/v[0-9.]+)?/containers/[a-zA-Z0-9_.-]+/json$"
    acl network_list path,url_dec -m reg -i "^(/v[0-9.]+)?/networks$"
    acl network_inspect path,url_dec -m reg -i "^(/v[0-9.]+)?/networks/[a-zA-Z0-9_.-]+$"

    http-request allow if read_method docker_ping
    http-request allow if read_method docker_version
    http-request allow if read_method docker_info
    http-request allow if read_method docker_events
    http-request allow if read_method container_list
    http-request allow if read_method container_inspect
    http-request allow if read_method network_list
    http-request allow if read_method network_inspect

    # Log rotation may only signal the configured Traefik container with USR1.
    acl post_method method POST
    acl traefik_kill path,url_dec -m reg -i "^(/v[0-9.]+)?/containers/${TRAEFIK_CONTAINER_NAME}/kill$"
    acl usr1_only query -m str signal=USR1
    http-request allow if post_method traefik_kill usr1_only

    http-request deny
    default_backend docker
